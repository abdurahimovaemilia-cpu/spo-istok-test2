<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кто ты в ИСТОКе?</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#dff4ff,#f7fbff 45%,#d9edff);
  display:flex; align-items:center; justify-content:center; overflow:hidden; color:#17324d;
}
body:before,body:after{
  content:""; position:fixed; border-radius:50%; filter:blur(2px); opacity:.55;
  animation:float 7s ease-in-out infinite;
}
body:before{width:240px;height:240px;background:#8ed8ff;left:-80px;top:-60px}
body:after{width:300px;height:300px;background:#b7c9ff;right:-110px;bottom:-100px;animation-delay:-3s}
.card{
  width:min(92vw,620px); min-height:520px; background:rgba(255,255,255,.88);
  backdrop-filter:blur(12px); border:1px solid rgba(255,255,255,.9);
  border-radius:30px; padding:34px; box-shadow:0 25px 70px rgba(36,100,150,.18);
  position:relative; z-index:2; overflow:hidden;
}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.badge{font-size:13px;font-weight:700;color:#2784ba;background:#e8f6ff;padding:9px 13px;border-radius:999px}
.progress{height:8px;background:#e7eef4;border-radius:20px;overflow:hidden;margin-bottom:30px}
.bar{height:100%;width:33.33%;background:linear-gradient(90deg,#36a9e1,#6f7df5);border-radius:20px;transition:.45s}
h1{font-size:30px;margin:0 0 14px;line-height:1.15}
.question{font-size:20px;font-weight:700;margin:0 0 22px}
.answers{display:grid;gap:12px}
.answer{
  width:100%; border:2px solid #e4edf3; background:white; padding:16px 18px;
  border-radius:17px; text-align:left; font-size:16px; cursor:pointer;
  color:#24435d; transition:.2s; position:relative;
}
.answer:hover{transform:translateY(-2px);border-color:#69bde9;box-shadow:0 8px 20px rgba(70,150,200,.12)}
.answer.selected{border-color:#398fd0;background:#edf8ff}
.next{
  margin-top:24px;width:100%;padding:16px;border:0;border-radius:17px;
  background:#287fba;color:#fff;font-size:16px;font-weight:700;cursor:pointer;
  opacity:.45;transition:.2s
}
.next.active{opacity:1}
.next.active:hover{transform:translateY(-2px);background:#216f9f}
.result{text-align:center;display:none;height:100%;align-items:center;justify-content:center;flex-direction:column}
.result .icon{font-size:72px;animation:pop .7s ease}
.result h2{font-size:38px;margin:14px 0 8px;color:#1e79b1}
.result p{font-size:18px;line-height:1.5;max-width:460px}
.restart{margin-top:18px;padding:13px 24px;border:0;border-radius:15px;background:#edf7fd;color:#2777a9;font-weight:700;cursor:pointer}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:5}
.piece{position:absolute;width:9px;height:16px;top:-30px;animation:fall 3.2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes float{50%{transform:translateY(25px) translateX(18px)}}
.fade{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:none}}
.small{font-size:13px;color:#71889a;margin-top:18px;text-align:center}
</style>
</head>
<body>
<div class="card">
  <div id="quiz">
    <div class="top">
      <strong>Тест</strong>
      <span class="badge" id="counter">1 / 3</span>
    </div>
    <div class="progress"><div class="bar" id="bar"></div></div>
    <div id="content" class="fade">
      <h1>Какой отряд тебе подходит?</h1>
      <p class="question" id="question"></p>
      <div class="answers" id="answers"></div>
      <button class="next" id="next">Выбрать ответ</button>
      <div class="small">Здесь нет неправильных ответов 👀</div>
    </div>
  </div>
  <div class="result" id="result">
    <div class="icon">🌊</div>
    <h2>СПО «ИСТОК»</h2>
    <p>Какие бы ответы ты ни выбрал — кажется, судьба уже всё решила.<br><b>Тебе подходит СПО «ИСТОК»!</b></p>
    <button class="restart" onclick="restart()">Пройти ещё раз</button>
  </div>
</div>
<div class="confetti" id="confetti"></div>

<script>
const questions=[
 {q:"В какой отряд ты бы хотел вступить?",a:["Педагогический","Дружный","Высококвалифицированный"]},
 {q:"В каком лагере ты бы хотел поработать летом?",a:["В лагере дневного пребывания","В загородном","На туристическо-спортивной базе"]},
 {q:"Чему ты хочешь научиться?",a:["Быть лидером","Тактично общаться с людьми","Выступать на сцене"]}
];
let current=0, selected=null;
const question=document.getElementById("question"),answers=document.getElementById("answers"),
next=document.getElementById("next"),bar=document.getElementById("bar"),counter=document.getElementById("counter");

function render(){
 selected=null; next.classList.remove("active"); next.textContent="Выбрать ответ";
 counter.textContent=(current+1)+" / "+questions.length;
 bar.style.width=((current+1)/questions.length*100)+"%";
 question.textContent=questions[current].q; answers.innerHTML="";
 document.getElementById("content").classList.remove("fade"); void document.getElementById("content").offsetWidth;
 document.getElementById("content").classList.add("fade");
 questions[current].a.forEach((x,i)=>{
  const b=document.createElement("button"); b.className="answer"; b.textContent=x;
  b.onclick=()=>{selected=i; document.querySelectorAll(".answer").forEach(e=>e.classList.remove("selected")); b.classList.add("selected"); next.classList.add("active"); next.textContent=current===2?"Узнать результат":"Дальше →"};
  answers.appendChild(b);
 });
}
next.onclick=()=>{if(selected===null)return;if(current<questions.length-1){current++;render()}else{showResult()}};
function showResult(){
 document.getElementById("quiz").style.display="none";
 document.getElementById("result").style.display="flex";
 confetti();
}
function confetti(){
 const c=document.getElementById("confetti"); c.innerHTML="";
 const chars=["#36a9e1","#6f7df5","#f7c948","#55c98a","#f28cae"];
 for(let i=0;i<80;i++){
  const p=document.createElement("span");p.className="piece";
  p.style.left=Math.random()*100+"vw";p.style.background=chars[i%chars.length];
  p.style.animationDelay=Math.random()*1.3+"s";p.style.transform=`rotate(${Math.random()*360}deg)`;
  c.appendChild(p);
 }
 setTimeout(()=>c.innerHTML="",4500);
}
function restart(){current=0;document.getElementById("result").style.display="none";document.getElementById("quiz").style.display="block";render()}
render();
</script>
</body>
</html>
