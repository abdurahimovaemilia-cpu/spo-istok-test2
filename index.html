<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5c928">
<title>Какой отряд тебе подходит?</title>
<style>
:root{--yellow:#f5c928;--gold:#d99a00;--ink:#34270a;--cream:#fff9e7}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;color:var(--ink);background:radial-gradient(circle at 15% 10%,#fff4b5 0,transparent 32%),linear-gradient(145deg,#fffbe9,#f8e6a2);display:flex;align-items:center;justify-content:center;padding:18px;overflow-x:hidden}
body:before,body:after{content:"";position:fixed;border-radius:50%;pointer-events:none;filter:blur(1px);opacity:.45;animation:float 8s ease-in-out infinite}body:before{width:230px;height:230px;background:#ffe45e;top:-80px;right:-50px}body:after{width:260px;height:260px;background:#ffd77a;bottom:-100px;left:-80px;animation-delay:-3s}
.card{position:relative;z-index:1;width:min(100%,620px);min-height:550px;background:rgba(255,253,246,.95);border:1px solid #fff;border-radius:30px;padding:clamp(22px,5vw,36px);box-shadow:0 22px 65px #a77a1826;overflow:hidden}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:12px}.brand{font-size:12px;font-weight:800;letter-spacing:2px;color:#977000;text-transform:uppercase}.badge{background:#fff0a8;border-radius:100px;padding:9px 12px;font-size:13px;font-weight:700;color:#795900}.progress{height:8px;background:#f2e8c5;border-radius:99px;overflow:hidden;margin-bottom:32px}.bar{height:100%;width:33.33%;border-radius:99px;background:linear-gradient(90deg,#f8d62d,#e9a900);transition:width .4s ease}h1{font-size:clamp(27px,6vw,36px);line-height:1.1;margin:0 0 22px;letter-spacing:-.7px}.question{font-size:19px;line-height:1.35;font-weight:700;margin:0 0 22px}.answers{display:grid;gap:12px}.answer{width:100%;text-align:left;border:2px solid #f0e5c3;background:#fffefa;padding:16px 17px;border-radius:17px;font-size:16px;color:#45360f;cursor:pointer;transition:transform .18s,border-color .18s,background .18s;min-height:56px}.answer:hover{transform:translateY(-2px);border-color:#e6bb19}.answer.selected{border-color:#dba900;background:#fff4bf;box-shadow:0 5px 14px #d9aa2920}.next{width:100%;margin-top:23px;padding:16px;border:0;border-radius:16px;background:#d8a400;color:#fff;font-size:16px;font-weight:800;cursor:pointer;opacity:.48;transition:.2s}.next.active{opacity:1}.next.active:hover{background:#bd8c00;transform:translateY(-2px)}.note{text-align:center;font-size:12px;color:#927c43;margin-top:17px}#result{display:none;min-height:470px;align-items:center;justify-content:center;flex-direction:column;text-align:center}.heart{width:112px;height:112px;display:grid;place-items:center;margin:4px auto 12px;animation:heartbeat 1.3s ease-in-out infinite}.heart svg{width:100%;height:100%;overflow:visible;filter:drop-shadow(0 9px 12px #d58b0040)}#result h2{font-size:clamp(31px,7vw,42px);margin:8px 0 12px;color:#bd8700}#result p{font-size:17px;line-height:1.55;max-width:440px;margin:0}.restart{margin-top:24px;padding:14px 23px;border:0;border-radius:15px;background:#fff0a8;color:#715300;font-weight:800;font-size:15px;cursor:pointer}.fade{animation:fade .35s ease}.confetti{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}.piece{position:absolute;width:8px;height:15px;top:-25px;border-radius:3px;animation:fall 3.4s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(740deg);opacity:0}}@keyframes fade{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}@keyframes float{50%{transform:translate(15px,25px)}}@keyframes heartbeat{0%,100%{transform:scale(1)}15%{transform:scale(1.08)}30%{transform:scale(1)}45%{transform:scale(1.05)}}@media(max-width:400px){.card{border-radius:24px}.question{font-size:18px}.answer{padding:14px}}
</style></head><body>
<main class="card"><section id="quiz"><div class="top"><span class="brand">Тест для тебя</span><span class="badge" id="counter">1 / 3</span></div><div class="progress"><div class="bar" id="bar"></div></div><div id="content" class="fade"><h1>Какой отряд тебе подходит?</h1><p class="question" id="question"></p><div class="answers" id="answers"></div><button class="next" id="next" type="button">Выбрать ответ</button><div class="note">Неправильных ответов нет ✨</div></div></section>
<section id="result"><div class="heart" aria-label="Горящее водное сердце"><svg viewBox="0 0 120 120" role="img" aria-hidden="true"><defs><linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff27a"/><stop offset=".55" stop-color="#ff9f1c"/><stop offset="1" stop-color="#ed4c24"/></linearGradient><linearGradient id="water" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8feaff"/><stop offset=".48" stop-color="#2caeea"/><stop offset="1" stop-color="#1764bd"/></linearGradient></defs><path d="M60 105 C48 91 14 72 15 46 C16 25 39 16 54 34 C57 38 59 42 60 44 C65 28 79 18 94 27 C113 39 103 65 91 79 C81 91 70 99 60 105Z" fill="url(#flame)"/><path d="M60 98 C48 86 24 69 25 48 C26 35 41 29 52 43 C56 48 59 52 60 55 C67 40 80 32 91 39 C103 48 94 67 83 79 C75 87 67 93 60 98Z" fill="url(#water)" stroke="#fff5b2" stroke-width="2"/><path d="M36 62 C43 54 48 63 55 62 S68 53 76 62 S88 66 91 59" fill="none" stroke="#d8fbff" stroke-width="3" stroke-linecap="round"/><path d="M42 75 C50 68 56 78 63 76 S76 69 82 75" fill="none" stroke="#d8fbff" stroke-width="2.5" stroke-linecap="round"/><path d="M27 33 Q20 22 31 13 M91 23 Q104 14 101 5 M61 22 Q68 12 62 4" fill="none" stroke="#f3bd18" stroke-width="4" stroke-linecap="round"/></svg></div><h2>СПО «ИСТОК»</h2><p>Какие бы ответы ты ни выбрал — кажется, судьба уже всё решила.<br><b>Тебе подходит ИСТОК!</b></p><button class="restart" type="button" onclick="restart()">Пройти ещё раз</button></section></main><div class="confetti" id="confetti"></div>
<script>
const questions=[{q:"В какой отряд ты бы хотел вступить?",a:["Педагогический","Дружный","Высококвалифицированный"]},{q:"В каком лагере ты бы хотел поработать летом?",a:["В лагере дневного пребывания","В загородном","На туристическо-спортивной базе"]},{q:"Чему ты хочешь научиться?",a:["Быть лидером","Тактично общаться с людьми","Выступать на сцене"]}];let current=0,selected=null;const $=id=>document.getElementById(id);
function render(){selected=null;$("next").classList.remove("active");$("next").textContent="Выбрать ответ";$("counter").textContent=(current+1)+" / "+questions.length;$("bar").style.width=((current+1)/questions.length*100)+"%";$("question").textContent=questions[current].q;$("answers").innerHTML="";$("content").classList.remove("fade");void $("content").offsetWidth;$("content").classList.add("fade");questions[current].a.forEach((answer,i)=>{const b=document.createElement("button");b.type="button";b.className="answer";b.textContent=answer;b.addEventListener("click",()=>{selected=i;document.querySelectorAll(".answer").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");$("next").classList.add("active");$("next").textContent=current===questions.length-1?"Узнать результат":"Дальше →"});$("answers").appendChild(b)})}
$("next").addEventListener("click",()=>{if(selected===null)return;if(current<questions.length-1){current++;render()}else showResult()});function showResult(){$("quiz").style.display="none";$("result").style.display="flex";confetti()}function confetti(){const c=$("confetti");c.innerHTML="";const colors=["#f5c928","#ff9f1c","#fff0a8","#f08c28","#e3b20b"];for(let i=0;i<75;i++){const p=document.createElement("span");p.className="piece";p.style.left=Math.random()*100+"vw";p.style.background=colors[i%colors.length];p.style.animationDelay=Math.random()*1.2+"s";c.appendChild(p)}setTimeout(()=>c.innerHTML="",4500)}function restart(){current=0;$("result").style.display="none";$("quiz").style.display="block";render()}render();
</script></body></html>
